<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1070" role="img" aria-labelledby="title desc">
<title id="title">SSO 일회용 인증 코드 연동 시퀀스</title><desc id="desc">SSO 세션 사용자 조회, 인증 코드 발급과 전달, JWT 교환 및 쿠키 저장, 요청별 인증 검증 흐름</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#334155"/></marker></defs>
<rect width="1500" height="1070" fill="white"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#172033">
<rect x="25" y="20" width="250" height="50" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="150" y="51" text-anchor="middle">브라우저</text><path d="M150 70 V1035" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="305" y="20" width="250" height="50" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="430" y="51" text-anchor="middle">Tomcat Servlet</text><path d="M430 70 V1035" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="615" y="20" width="250" height="50" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="740" y="51" text-anchor="middle">FastAPI 인증 API</text><path d="M740 70 V1035" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="925" y="20" width="250" height="50" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="1050" y="51" text-anchor="middle">Next.js Route Handler</text><path d="M1050 70 V1035" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="1225" y="20" width="250" height="50" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="1350" y="51" text-anchor="middle">Next.js Proxy</text><path d="M1350 70 V1035" stroke="#94a3b8" stroke-dasharray="6 5"/>
<path d="M150 175 H430" stroke="#334155" marker-end="url(#arrow)"/><text x="290.0" y="163" text-anchor="middle">SSO 로그인 요청</text>
<path d="M430 220 h65 v38 h-65" fill="none" stroke="#334155" marker-end="url(#arrow)"/><text x="507" y="242">SSO 세션의 사용자 정보 조회</text>
<path d="M430 320 H740" stroke="#334155" marker-end="url(#arrow)"/><text x="585.0" y="308" text-anchor="middle">일회용 인증 코드 발급 요청</text>
<path d="M740 380 H430" stroke="#334155" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="585.0" y="368" text-anchor="middle">짧은 TTL의 인증 코드</text>
<path d="M430 440 H150" stroke="#334155" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="290.0" y="428" text-anchor="middle">인증 코드를 URL에 포함해 리다이렉트</text>
<path d="M150 585 H1050" stroke="#334155" marker-end="url(#arrow)"/><text x="600.0" y="573" text-anchor="middle">인증 코드가 포함된 콜백 요청</text>
<path d="M1050 650 H740" stroke="#334155" marker-end="url(#arrow)"/><text x="895.0" y="638" text-anchor="middle">인증 코드를 JWT로 교환 요청</text>
<path d="M740 710 H1050" stroke="#334155" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="895.0" y="698" text-anchor="middle">서비스용 JWT</text>
<path d="M1050 775 H150" stroke="#334155" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="600.0" y="763" text-anchor="middle">JWT 쿠키 저장 · 루트 경로로 리다이렉트</text>
<path d="M150 850 H1350" stroke="#334155" marker-end="url(#arrow)"/><text x="750.0" y="838" text-anchor="middle">서비스 요청 · JWT 쿠키 포함</text>
<path d="M1350 895 h65 v38 h-65" fill="none" stroke="#334155" marker-end="url(#arrow)"/><text x="1335" y="917" text-anchor="end">인증 검증</text>
<rect x="1050" y="965" width="425" height="70" rx="4" fill="#fff8dc" stroke="#b8a76b"/>
<text x="1262.5" y="992" text-anchor="middle">유효하면 서비스 접근 허용</text>
<text x="1262.5" y="1018" text-anchor="middle">토큰 만료·인증 실패 시 오류 페이지 이동</text>
</g>
</svg>
